<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leadsguru Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #4f46e5);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #3730a3;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      color: #4f46e5;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Leadsguru</div>

    <p class="subtitle">Welcome Back! Please Login</p>

    <form onsubmit="loginUser(event)">

      <input
        type="text"
        id="user"
        placeholder="Mobile
