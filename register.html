<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadsguru Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #4f46e5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .login-link {
      display: block;
      margin-top: 20px;
      color: #4f46e5;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">Leadsguru</div>

    <div class="subtitle">
      Create Your Account
    </div>

    <form id="registerForm">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="tel"
        id="mobile"
        placeholder="Mobile Number"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Create Password"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <a href="login.html" class="login-link">
      Already have an account? Login
    </a>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBxzvTEqz6Vsy99PEa9jufF-57cVlCMBOA",
  authDomain: "leads-guru-b88bc.firebaseapp.com",
  projectId: "leads-guru-b88bc",
  storageBucket: "leads-guru-b88bc.firebasestorage.app",
  messagingSenderId: "826171584448",
  appId: "1:826171584448:web:0d41c37b895a679775e225",
  measurementId: "G-3PKGX5C7DH"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");


        if (password !== confirmPassword) {

          message.innerText =
            "Passwords do not match.";

          message.style.color = "red";

          return;
        }


        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          message.innerText =
            "Account created successfully!";

          message.style.color = "green";

          document
            .getElementById("registerForm")
            .reset();

        } catch (error) {

          message.innerText =
            error.message;

          message.style.color = "red";

        }

      });

  </script>

</body>
</html>
