<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadsguru Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #4f46e5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      color: #4f46e5;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Leadsguru</div>

    <div class="subtitle">
      Welcome Back! Please Login
    </div>

    <form onsubmit="loginUser(event)">

      <input
        type="text"
        id="user"
        placeholder="Mobile Number or Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <a href="#" class="forgot">
      Forgot Password?
    </a>

    <div class="message" id="message"></div>

    <a
      href="https://adityaranwa25-boop.github.io/Leadsguru-Website-New/"
      class="back"
    >
      ← Back to Website
    </a>

  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();

      document.getElementById("message").innerText =
        "Login system will be connected soon.";
    }
  </script>

</body>
  </html>
