<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadsguru Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #4f46e5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-link {
      display: block;
      margin-top: 20px;
      color: #4f46e5;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">Leadsguru</div>

    <div class="subtitle">
      Create Your Account
    </div>

    <form onsubmit="registerUser(event)">

      <input
        type="text"
        placeholder="Full Name"
        required
      >

      <input
        type="tel"
        placeholder="Mobile Number"
        required
      >

      <input
        type="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        placeholder="Create Password"
        required
      >

      <input
        type="password"
        placeholder="Confirm Password"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <a href="login.html" class="login-link">
      Already have an account? Login
    </a>

  </div>

  <script>
    function registerUser(event) {
      event.preventDefault();

      document.getElementById("message").innerText =
        "Registration system will be connected soon.";
    }
  </script>

</body>
</html>
